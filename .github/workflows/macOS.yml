name: macOS VNC (Tailscale)

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Enable Screen Sharing (Legacy VNC)
        run: |
          PASS="${{ secrets.VNC_PASSWORD || '123456' }}"
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "$PASS" -admin
          sudo createhomedir -c -u vncuser > /dev/null 2>&1 || true

          # Enable legacy VNC authentication for RealVNC Viewer
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PASS"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -restart -agent -console

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Print Connection Info
        run: |
          echo "=== VNC ADDRESS ==="
          echo "$(tailscale ip -4):5900"
          echo "Username: vncuser"

      - name: Keep Alive
        run: sleep 21000

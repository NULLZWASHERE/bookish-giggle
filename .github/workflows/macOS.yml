name: macOS VNC (Tailscale)

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Enable Screen Sharing
        run: |
          PASS="${{ secrets.VNC_PASSWORD || '123456' }}"
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "$PASS" -admin
          sudo createhomedir -c -u vncuser > /dev/null 2>&1 || true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users vncuser -privs -all -restart -agent
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Print Connection Info
        run: |
          echo "=== VNC ADDRESS ==="
          echo "$(tailscale ip -4):5900"
          echo "Username: vncuser"

      - name: Keep Alive
        run: sleep 21000
